<!DOCTYPE html>
<html lang="zh-TW" data-theme="clover">

<head>
  <base href="/">
  <link rel="icon" href="gold.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular-csp.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/json-browse@0.2.0/json-browse/jquery.json-browse.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/output.css?date=20260630" />
  <!-- 自定義樣式 --><!-- 自定義主題 CSS 
 -->
  <link href="css/themes.css" rel="stylesheet" type="text/css" />
  <script src="/js/highstock.js"></script>
  <script src="/js/highstock-data.js"></script>
  <script src="/js/highstock-accessibility.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-resource/1.8.3/angular-resource.min.js"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-route/1.8.3/angular-route.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <!-- AI 對話卡片用：把 AI 回覆的 markdown 轉成 HTML（marked）並過濾潛在惡意標籤（dompurify）再顯示 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <!-- AI 對話卡片：markdown 轉出來的表格/清單沒有 Tailwind Typography plugin 可用，手動補基本樣式 -->
  <style>
    .ai-chat-bubble { max-width: 100%; overflow-x: auto; }
    .ai-chat-bubble table { border-collapse: collapse; margin: 0.5em 0; font-size: 0.85em; }
    .ai-chat-bubble th, .ai-chat-bubble td { border: 1px solid currentColor; padding: 0.25em 0.5em; opacity: 0.9; }
    .ai-chat-bubble ul, .ai-chat-bubble ol { padding-left: 1.25em; margin: 0.25em 0; }
    .ai-chat-bubble p { margin: 0.25em 0; }
    .ai-chat-bubble code { background: rgba(0,0,0,0.15); padding: 0.1em 0.3em; border-radius: 0.25em; }
  </style>
</head>

<body ng-app="rich-app" ng-controller="indexCtrl" class="bg-base-200 text-base-content font-rich">
  <!-- 使用 DaisyUI 的 navbar 組件 -->
  <div class="navbar bg-base-100 shadow-sm">
    <div class="navbar-start text-primary" ng-click="home()">
      <div class="btn btn-ghost text-3xl font-bold text-primary hover:bg-base-100 font-title"> <svg fill="currentColor"
          class="icon-investment size-[1em]">
          <use xlink:href="css/symbol-defs.svg#icon-investment"></use>
        </svg> <span ng-bind="name"></span></div>
    </div>
    <div class="navbar-center flex-wrap gap-2">
      <h2 class="text-xl text-primary">績優股</h2>
      <!-- 股票選擇器 -->
      <div class="form-control">
        <select class="select select-bordered select-sm w-full max-w-xs" ng-model="stock" ng-change="change()"
          ng-options="(s.code + ' ' + (s.otc ? '🌱' : '') + s.name + (s.ma ? s.ma : '') + (s.profit ? s.profit : '')) for s in stocks">
          <option value="">-- 請選擇股票 --</option>
        </select>
      </div>
      <!-- MA 選擇器 -->
      <div class="form-control">
        <select class="select select-bordered select-sm w-full max-w-xs" ng-model="stock.defaultMa"
          ng-change="changeMa()" ng-options="ma for ma in mas">
          <option value="">-- MA設定 --</option>
        </select>
      </div>
      <!-- 用戶選擇器 -->
      <div class="form-control">
        <select class="select select-bordered select-sm w-full max-w-xs" ng-model="user" ng-change="switch()"
          ng-options="u.name for u in users">
          <option value="">-- 選擇用戶 --</option>
        </select>
      </div>
    </div>
    <div class="navbar-end">
      <!-- 操作按鈕組 -->
      <div class="join">
        <button class="btn btn-primary join-item" ng-if="!stock.code" ng-click="add.blank()" data-tip="新增股票">
          <svg fill="currentColor" class="icon-eye-plus size-[1em]">
            <use xlink:href="css/symbol-defs.svg#icon-eye-plus"></use>
          </svg> 股票
        </button>
        <button class="btn btn-primary join-item" ng-click="simulate.setup()" data-tip="模擬回測">
          <svg fill="currentColor" class="icon-spinner9 size-[1em]">
            <use xlink:href="css/symbol-defs.svg#icon-spinner9"></use>
          </svg> 回測
        </button>
        <button class="btn btn-primary join-item" ng-click="sql.show()" data-tip="SQL">⛁</button>
      </div>
    </div>
  </div>
  <div id="stock-form" class="rounded-2xl grid gap-4 p-6 bg-base-100 max-w-md mx-auto shadow-lg" style="display: none">
    <div class="text-left">
      <h3 class="text-2xl text-primary font-bold mb-4">新增股票</h3>
      <div class="grid gap-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text text-sm text-success">股票代碼</span>
          </label>
          <input ng-model="add.code" class="input input-bordered w-full" placeholder="請輸入股票代碼" />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text text-sm text-success">股票名稱</span>
          </label>
          <input ng-model="add.name" class="input input-bordered w-full" placeholder="請輸入股票名稱" />
        </div>
      </div>
      <div ng-if="add.save.result" class="alert alert-info mt-4">
        <span ng-bind="add.save.result"></span>
      </div>
      <div class="flex justify-end mt-6">
        <button ng-click="add.save()" class="btn btn-primary">
          <svg fill="currentColor" class="icon-eye-plus size-[1em] mr-2">
            <use xlink:href="css/symbol-defs.svg#icon-eye-plus"></use>
          </svg>確認新增
        </button>
      </div>
    </div>
  </div>
  <div id="note-form" class="rounded-2xl grid gap-4 p-6 bg-base-100 max-w-2xl mx-auto shadow-lg" style="display: none">
    <div class="text-left">
      <h3 class="text-2xl text-primary font-bold mb-4">筆記編輯</h3>
      <div class="grid gap-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text text-sm text-success">標題</span>
          </label>
          <input ng-model="note.model.title" class="input input-bordered w-full" placeholder="請輸入筆記標題" />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text text-sm text-success">內容</span>
          </label>
          <textarea ng-model="note.model.content" class="textarea textarea-bordered w-full h-32"
            placeholder="請輸入筆記內容"></textarea>
        </div>
      </div>
      <div ng-if="note.save.result" class="alert alert-info mt-4">
        <span ng-bind="note.save.result"></span>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button ng-click="note.save()" class="btn btn-primary">
          <svg fill="currentColor" class="icon-addnote size-[1em] mr-2">
            <use xlink:href="css/symbol-defs.svg#icon-addnote"></use>
          </svg>儲存
        </button>
        <button ng-if="note.model.id" ng-click="note.destroy()" class="btn btn-error">
          <svg fill="currentColor" class="icon-crying size-[1em] mr-2">
            <use xlink:href="css/symbol-defs.svg#icon-crying"></use>
          </svg>刪除
        </button>
      </div>
    </div>
  </div>
  <div id="simulate-form" class="rounded-2xl grid gap-4 p-6 bg-base-100 max-w-3xl mx-auto shadow-lg"
    style="display: none">
    <div class="text-left">
      <h3 class="text-2xl text-primary font-bold mb-4">模擬回測設定</h3>
      <div class="grid gap-4">
        <div class="bg-success rounded-2xl p-4">
          <h4 class="text-lg text-base-100 font-bold mb-3">回測參數</h4>
          <div class="grid grid-cols-2 gap-4 text-base-100">
            <div class="list">
              <span class="text-sm text-base-200">回測股票</span>

              <span class="text-lg font-bold">
                <span ng-repeat="group in simulate.stockGroups">
                  <input type="radio" ng-model="simulate.stockGroup" value="{{group}}" class="radio" />
                  <span ng-bind="group"></span><br />
                </span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="flex justify-end mt-6">
        <button ng-click="simulate.open()" class="btn btn-primary btn-lg">
          <svg fill="currentColor" class="icon-spinner9 size-[1em] mr-2">
            <use xlink:href="css/symbol-defs.svg#icon-spinner9"></use>
          </svg>開始回測
        </button>
      </div>
    </div>
  </div>
  <div class="flex min-h-screen">
    <!-- Left Column (20%) -->
    <div class="w-1/5 p-4 space-y-4 flex flex-col">
      <div class="stats cursor-pointer mx-auto stats-vertical">
        <!-- 
        <div class="stat">
          <div class="stat-title">角色</div>
          <div class="stat-value text-rich-master" ng-click="showTrades(true)">Master</div>
          <div class="stat-value" ng-click="showTrades()">實際</div>
        </div>
         -->
        <div class="stat">
          <div class="stat-figure text-secondary">
            <svg fill="currentColor" class="icon-gold size-[3em] ">
              <use xlink:href="css/symbol-defs.svg#icon-gold"></use>
            </svg>
          </div>
          <div class="stat-title">總資金</div>
          <!-- 
          <div class="stat-value text-rich-master"><span class="font-price"
              ng-bind="invested.totalCapital | number:0"></span>
          </div>
          -->
          <div class="stat-value"><span class="font-price" ng-bind="invested.totalCapital | number:0"></span></div>
        </div>
        <div class="stat">
          <div class="stat-figure text-secondary">
            <svg fill="currentColor" class="icon-salary size-[3em]">
              <use xlink:href="css/symbol-defs.svg#icon-salary"></use>
            </svg>
          </div>
          <div class="stat-title">目前投資</div>
          <!-- 
          <div class="stat-value text-rich-master"><span class="font-price" ng-bind="shadowed.cost | number:0"></span>
          </div>-->
          <div class="stat-value"><span class="font-price" ng-bind="invested.cost | number"></span></div>
        </div>
        <div class="stat">
          <div class="stat-figure text-secondary">
            <svg fill="currentColor" class="icon-wallet size-[3em]">
              <use xlink:href="css/symbol-defs.svg#icon-wallet"></use>
            </svg>
          </div>
          <div class="stat-title">剩餘資金</div>
          <!-- 
          <div class="stat-value text-rich-master"><span class="font-price"
              ng-bind="(invested.totalCapital - shadowed.cost) | number:0"></span>
          </div>
          -->
          <div class="stat-value"><span class="font-price"
              ng-bind="(invested.totalCapital - invested.cost) | number:0"></span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-figure text-secondary">
            <svg fill="currentColor" class="icon-wallet size-[3em]">
              <use xlink:href="css/symbol-defs.svg#icon-wallet"></use>
            </svg>
          </div>
          <div class="stat-title">績效</div>
          <!-- 
          <div class="stat-value"><span class="font-price" ng-bind="shadowed.profit.scale() | number"></span></div>
          -->
          <div class="stat-value"><span class="font-price" ng-bind="invested.profit.scale() | number"></span></div>
          <div class="stat-desc">偏差值 <span ng-bind="invested.diffRate.scale(2) | pct"></span>％</div>
        </div>
      </div>
      <div class="mockup-code bg-success text-success-content">
        <div class="flex ml-10">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-4 text-white">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m9 13.5 3 3m0 0 3-3m-3 3v-6m1.06-4.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
          </svg>
          <span class="ml-2">入場策略：</span>
          <span ng-bind="entryStrategy.name"></span>
          <span class="text-accent" ng-if="entryStrategy.reentry">（返場）</span>
          <span class="text-secondary" ng-if="entryStrategy.adxRate">＋三日斜率閥值 <span ng-bind="entryStrategy.adxRate"
              class="text-error"></span>％</span>
        </div>
        <div class="flex ml-10">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-4 text-white">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
          </svg>
          <span class="ml-2">出場策略：</span>
          <span ng-bind="exitStrategy.name"></span>
          <span class="text-secondary" ng-if="exitStrategy.reentry">（返場）</span>
          <span class="text-secondary" ng-if="exitStrategy.dynamicStop">＋動態止損 <span ng-bind="exitStrategy.stopLossPct"
              class="text-error"></span>％</span>
          <span class="text-secondary" ng-if="exitStrategy.dynamicStop">止盈 <span ng-bind="exitStrategy.takeProfitPct"
              class="text-error"></span>％</span>
          <span class="text-secondary" ng-if="exitStrategy.adxRate">＋三日斜率閥值 <span ng-bind="exitStrategy.adxRate"
              class="text-error"></span>％</span>
          <span class="text-secondary" ng-if="exitStrategy.drawdownRate">＋最高回撤出清 <span
              ng-bind="exitStrategy.drawdownRate" class="text-error"></span>％</span>
        </div>
      </div>

      <div class="list">
        <div class="self-end">
          <button class="btn btn-primary" ng-click="note.edit()"><svg fill="currentColor"
              class="icon-addnote size-[1.5em]">
              <use xlink:href="css/symbol-defs.svg#icon-addnote"></use>
            </svg></button>
        </div>
        <div class="list-row cursor-pointer hover:bg-base-100" ng-repeat="note in notes" ng-click="edit(note)">
          <span ng-bind="note.date | date:'MM/dd'" class="font-date text-xl text-accent"></span>
          <span ng-bind="note.title" class=""></span>
        </div>
        <div class="list-row hover:bg-base-100" ng-repeat="log in logs">
          <span ng-bind="log.date | date:'MM/dd HH:mm'" class="font-date text-xl text-info"></span>
          <span ng-bind="log.msg"></span>
        </div>
      </div>

      <!-- Theme selector & AI Chat (fixed at bottom of left column) -->
      <div class="space-y-3">
        <div class=" form-control">
          <label class="label py-1">
            <span class="label-text text-xs">DaisyUI 主題</span>
          </label>
          <select class="select select-bordered select-sm w-full" ng-model="theme.current" ng-change="theme.change()"
            ng-options="t as t for t in theme.list">
          </select>
        </div>

        <div class="card bg-base-200 shadow-sm border border-base-300">
          <div class="card-body p-3 gap-2">
            <div class="flex items-center gap-2 text-sm font-bold text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
              </svg>
              AI 對話
              <button type="button" class="btn btn-ghost btn-xs btn-circle ml-auto" title="清空目前對話"
                ng-click="chat.clear()" ng-disabled="chat.busy">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
              </button>
              <button type="button" class="btn btn-ghost btn-xs btn-circle" title="這個 AI 助手能做什麼？"
                ng-click="chat.help()" ng-disabled="chat.busy">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 17.25h.008v.008H12v-.008Z" />
                </svg>
              </button>
            </div>
            <div class="ai-chat-scroll min-h-[420px] max-h-[70vh] overflow-y-auto space-y-1 pr-1">
              <div class="chat chat-start" ng-repeat="m in chat.messages">
                <div class="chat-bubble ai-chat-bubble" ng-class="m.from === 'user' ? 'chat-bubble-primary' : 'chat-bubble-neutral'"
                  ng-bind="m.text" ng-if="m.from === 'user'"></div>
                <div class="chat-bubble ai-chat-bubble chat-bubble-neutral"
                  ng-bind-html="chat.render(m.text)" ng-if="m.from !== 'user'"></div>
              </div>
              <div class="text-center text-xs text-base-content/50" ng-if="!chat.messages.length">
                尚無訊息，輸入問題開始對話
              </div>
            </div>
            <div class="text-xs text-base-content/40" ng-if="chat.currentCode()">
              將自動附上目前股票代號：<span class="font-mono">{{chat.currentCode()}}</span>
            </div>
            <div class="text-xs text-base-content/50 italic" ng-if="chat.status" ng-bind="chat.status"></div>
            <div class="join">
              <input type="text" class="input input-bordered input-sm join-item flex-1" placeholder="輸入訊息..."
                ng-model="chat.input" ng-keypress="chat.keypress($event)" ng-disabled="chat.busy" />
              <button class="btn btn-sm btn-primary join-item" ng-click="chat.send()" ng-disabled="chat.busy">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column (80%) -->
    <div class="w-4/5 p-4 space-y-4">
      <div ng-view class=""></div>
    </div>

    <div id="sql-form" style="display: none">
      <br />
      <div>
        <textarea style="border: 1px solid #ccc;" rows="4" cols="50" ng-model="sql.commands"></textarea>
        <pre style="text-align: left; overflow-y: scroll; width: 96%;" id="sql-result" class="json-body"></pre>
      </div>
      <div>
        <p>
          <button ng-click="sql.exec()">確認</button>
        </p>
      </div>
    </div>
    <script src="/js/lang.js"></script>
    <script src="/js/svg-helper.js"></script>
